<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""/>
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Document</title>
</head>
<body>
    <header class="header">
    <h1>Legislación y Catastro</h1>
    <span>Visor geográfico</span>
</header>

<div class="container">

    <aside class="sidebar">

        <h2>Información</h2>

        <p>
            Visualización geográfica para consulta y análisis
            de información territorial.
        </p>

        <div class="info-box">
            <h3>Ubicación</h3>
            <p>Área de consulta geográfica</p>
        </div>

        <div class="info-box">
            <h3>Mapa interactivo</h3>
            <p>Utiliza el mapa para explorar el territorio.</p>
        </div>

        <div class="info-box">
            <h3>Herramientas</h3>
            <p>Acerca, aleja y desplázate por el mapa.</p>
        </div>

    </aside>

    <main class="map-container">
        <div id="map"></div>
    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="script.js"></script>
     
</body>
</html>
